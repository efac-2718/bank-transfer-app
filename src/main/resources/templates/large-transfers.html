<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Large Transfers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" th:href="@{/}">Bank Transfer System</a>
            <nav>
                <a th:href="@{/}">Dashboard</a>
                <a class="active" th:href="@{/large-transfers(min=10000)}">Large transfers</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- Task 12: transfers of at least ?min= -->
        <section class="card">
            <div class="card-head">
                <h2>Large Transfers</h2>
                <form class="inline" th:action="@{/large-transfers}" method="get">
                    <label for="min">Minimum (LKR)</label>
                    <input id="min" type="number" step="0.01" min="0" name="min" th:value="${min}">
                    <button type="submit">Show</button>
                </form>
            </div>
            <p class="muted">
                Transfers of LKR <strong th:text="${#numbers.formatDecimal(min, 1, 'COMMA', 2, 'POINT')}">10,000.00</strong>
                or more, largest first (<span th:text="${#lists.size(transfers)}">0</span> found).
            </p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Date</th>
                            <th>From</th>
                            <th>To</th>
                            <th class="num">Amount (LKR)</th>
                            <th class="num">Fee</th>
                            <th>Status</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${transfers}">
                            <td th:text="${t.id}">1</td>
                            <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-11-02 10:00:00</td>
                            <td><a th:href="@{/accounts/{acc}/history(acc=${t.fromAccount})}" th:text="${t.fromAccount}">100001</a></td>
                            <td><a th:href="@{/accounts/{acc}/history(acc=${t.toAccount})}" th:text="${t.toAccount}">100002</a></td>
                            <td class="num" th:text="${#numbers.formatDecimal(t.amount, 1, 'COMMA', 2, 'POINT')}">20,000.00</td>
                            <td class="num" th:text="${#numbers.formatDecimal(t.fee, 1, 'COMMA', 2, 'POINT')}">200.00</td>
                            <td><span class="badge" th:classappend="${t.status.name() == 'SUCCESS'} ? 'ok' : 'bad'"
                                      th:text="${t.status}">SUCCESS</span></td>
                            <td th:text="${t.description}">Transfer completed</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(transfers)}">
                            <td colspan="8" class="empty">No transfers of this size</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</body>

</html>
