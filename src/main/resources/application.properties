spring.application.name=bank-transfer-app

# ---- MySQL connection (XAMPP defaults: user root, empty password) ----
# createDatabaseIfNotExist=true creates the database "bank_db" automatically
spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Optional: if your MySQL has a password, put it in secrets.properties (ignored by Git)
#spring.config.import=optional:file:./secrets.properties

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Show transaction begin / commit / rollback in the console (great for this lab) ----
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Session ----
# Keep the session id in a cookie only. Otherwise the first redirect after a form post goes to
# "/;jsessionid=..." which Spring MVC answers with 404, and the success / error message is lost.
server.servlet.session.tracking-modes=cookie

# ---- Task 12: transfer fee ----
# Percentage of every transfer that is withdrawn from the sender and paid into the bank account 999999.
# Set it to 0 to reproduce the exact balances of the Task 9 / Task 10 tests.
bank.transfer-fee-percent=1
